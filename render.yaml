databases:
  - name: ghost-db
    plan: free
    databaseName: ghost
services:
  - type: web
    name: angry-ghost-hunt
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ghost-db
          property: connectionString
      - key: GM_PIN
        sync: false
      - key: TEAM_A_PIN
        sync: false
      - key: TEAM_B_PIN
        sync: false
